<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Auction - Пошук лотів</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <header>
            <h1>🏛️ Internet Auction</h1>
            <p class="subtitle">Пошук та фільтрація лотів</p>
        </header>

        <!-- Форма пошуку й фільтрів -->
        <section class="search-section">
            <h2>Пошук лотів</h2>
            <form id="searchForm" class="search-form">
                <div class="form-group">
                    <label for="searchQuery">Пошук по назві:</label>
                    <input 
                        type="text" 
                        id="searchQuery" 
                        placeholder="Напр., iPhone, золотий годинник..." 
                        class="input-field">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="minPrice">Мінімальна ціна (₴):</label>
                        <input 
                            type="number" 
                            id="minPrice" 
                            placeholder="0" 
                            min="0" 
                            class="input-field">
                    </div>

                    <div class="form-group">
                        <label for="maxPrice">Максимальна ціна (₴):</label>
                        <input 
                            type="number" 
                            id="maxPrice" 
                            placeholder="999999" 
                            min="0" 
                            class="input-field">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Статус лота:</label>
                        <select id="status" class="input-field">
                            <option value="">-- Всі --</option>
                            <option value="Pending">Очікує підтвердження</option>
                            <option value="Active">Активні торги</option>
                            <option value="Sold">Продано</option>
                            <option value="NotSold">Не продано</option>
                            <option value="Cancelled">Скасовано</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="categoryId">Категорія:</label>
                        <select id="categoryId" class="input-field">
                            <option value="">-- Всі категорії --</option>
                            <option value="1">Electronics</option>
                            <option value="2">Phones</option>
                            <option value="3">Watches</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">🔍 Пошук</button>
                    <button type="reset" class="btn btn-secondary">🔄 Скинути</button>
                </div>
            </form>
        </section>

        <!-- Статус завантаження -->
        <div id="loading" class="loading" style="display: none;">
            ⏳ Завантаження лотів...
        </div>

        <!-- Помилка -->
        <div id="error" class="error-message" style="display: none;"></div>

        <!-- Список лотів -->
        <section class="results-section">
            <h2>Результати пошуку</h2>
            <div id="lotsList" class="lots-grid">
                <!-- Лоти будуть додані JavaScript -->
            </div>
            
            <div id="noResults" class="no-results" style="display: none;">
                <p>❌ Лотів не знайдено. Спробуй змінити критерії пошуку.</p>
            </div>
        </section>
    </div>

    <!-- Модальне вікно для деталей лота -->
    <div id="lotModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
